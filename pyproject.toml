[project]
name = "ddomlab-eln"
version = "0.1.0"
description = "Log instrument runs to the DDOM Lab eLabFTW: create experiments from templates, fill fields, link resources, attach files."
readme = "README.md"
authors = [
    { name = "ravi", email = "ravichandu.b1409@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "elabapi-python>=6.0.1,<6.1",
    "urllib3>=1.26",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
